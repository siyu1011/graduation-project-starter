server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        name: JSESSIONID
        http-only: true
        same-site: lax
        secure: false
spring:
  application:
    name: graduation-project-starter
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/graduation_starter?characterEncoding=UTF-8&connectionTimeZone=%2B08:00&forceConnectionTimeZoneToSession=true}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 5000
  sql:
    init:
      mode: never
  jackson:
    time-zone: Asia/Shanghai
    deserialization:
      fail-on-unknown-properties: true
      fail-on-numbers-for-enums: true
mybatis-plus:
  mapper-locations: classpath:/mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
